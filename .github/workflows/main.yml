name: Validate Ukrainian reference

on:
  push:
    branches: [main, ukrainian-standalone]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build standalone pages
        run: node build.cjs
      - name: Audit source data
        run: node audit.cjs
      - name: Test
        run: node --test tests/*.test.cjs
      - name: Check committed pages match the sources
        run: git diff --exit-code -- '*.html' src/locale/uk.json
      - name: Package nginx files
        run: |
          mkdir -p site
          cp mutations.html index.html character.html augmetics.html combat.html equipment.html protection.html psy.html services.html weapons.html criticalwounds.html README.md MAINTAINING.md NOTICE.md LICENSE site/
          cp -r licenses site/
      - name: Save static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: imperium-maledictum-ua-static
          path: site/
          if-no-files-found: error
